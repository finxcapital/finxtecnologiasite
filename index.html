<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#142141" />
  <meta name="description" content="Finx Tecnologia — site em construção." />
  <title>Finx Tecnologia | Em construção</title>

  <style>
    :root {
      --navy: #142141;
      --navy-2: #0d1730;
      --blue: #014EDC;
      --cyan: #115978;
      --yellow: #FCD02B;
      --white: #ffffff;
      --muted: rgba(255,255,255,.68);
      --line: rgba(255,255,255,.10);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      color-scheme: dark;
    }

    body {
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 15% 20%, rgba(1,78,220,.22), transparent 28rem),
        radial-gradient(circle at 88% 78%, rgba(17,89,120,.28), transparent 32rem),
        var(--navy-2);
      color: var(--white);
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .22;
      background-image:
        linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: linear-gradient(to bottom, black, transparent 78%);
    }

    .glow {
      position: fixed;
      width: 28rem;
      height: 28rem;
      border-radius: 999px;
      filter: blur(90px);
      opacity: .18;
      pointer-events: none;
      animation: drift 12s ease-in-out infinite alternate;
    }

    .glow-a {
      top: -10rem;
      right: -8rem;
      background: var(--yellow);
    }

    .glow-b {
      bottom: -13rem;
      left: -10rem;
      background: var(--blue);
      animation-delay: -4s;
    }

    main {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      width: min(1120px, calc(100% - 40px));
      margin: 0 auto;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 108px;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      text-decoration: none;
    }

    .brand img {
      display: block;
      width: 148px;
      height: auto;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 8px 12px;
      border: 1px solid rgba(252,208,43,.22);
      background: rgba(252,208,43,.07);
      border-radius: 999px;
      color: #ffe06a;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .09em;
      text-transform: uppercase;
    }

    .status::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--yellow);
      box-shadow: 0 0 0 5px rgba(252,208,43,.10);
      animation: pulse 1.8s ease-out infinite;
    }

    .hero {
      flex: 1;
      display: grid;
      align-content: center;
      max-width: 860px;
      padding: 72px 0 88px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      width: fit-content;
      color: var(--yellow);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
      margin-bottom: 28px;
    }

    .eyebrow::before {
      content: "";
      width: 34px;
      height: 2px;
      background: var(--yellow);
    }

    h1 {
      max-width: 820px;
      font-size: clamp(3.1rem, 7vw, 6.4rem);
      line-height: .94;
      letter-spacing: -.06em;
      font-weight: 800;
      text-wrap: balance;
    }

    h1 span {
      color: var(--yellow);
    }

    .lead {
      max-width: 620px;
      margin-top: 30px;
      color: var(--muted);
      font-size: clamp(1rem, 1.6vw, 1.18rem);
      line-height: 1.7;
    }

    .construction {
      margin-top: 44px;
      width: min(580px, 100%);
    }

    .construction-meta {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      color: rgba(255,255,255,.45);
      font-size: 12px;
      letter-spacing: .08em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .track {
      position: relative;
      height: 5px;
      border-radius: 999px;
      background: rgba(255,255,255,.08);
      overflow: hidden;
    }

    .track::before {
      content: "";
      position: absolute;
      inset: 0;
      width: 46%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--blue), var(--yellow));
      box-shadow: 0 0 24px rgba(252,208,43,.24);
      animation: loading 2.8s ease-in-out infinite alternate;
    }

    footer {
      min-height: 82px;
      border-top: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      color: rgba(255,255,255,.40);
      font-size: 12px;
    }

    .footer-mark {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .footer-mark i {
      display: block;
      width: 8px;
      height: 8px;
      background: var(--yellow);
      transform: rotate(45deg);
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(252,208,43,.35); }
      70% { box-shadow: 0 0 0 8px rgba(252,208,43,0); }
      100% { box-shadow: 0 0 0 0 rgba(252,208,43,0); }
    }

    @keyframes loading {
      from { transform: translateX(-10%); }
      to { transform: translateX(125%); }
    }

    @keyframes drift {
      from { transform: translate3d(0,0,0) scale(1); }
      to { transform: translate3d(40px,30px,0) scale(1.08); }
    }

    @media (max-width: 700px) {
      body {
        overflow: auto;
      }

      main {
        width: min(100% - 28px, 1120px);
      }

      header {
        min-height: 88px;
      }

      .brand img {
        width: 118px;
      }

      .status {
        font-size: 10px;
        padding: 7px 10px;
      }

      .hero {
        padding: 76px 0;
      }

      h1 {
        font-size: clamp(3rem, 15vw, 4.8rem);
      }

      .lead {
        margin-top: 24px;
      }

      footer {
        padding: 22px 0;
        align-items: flex-start;
        flex-direction: column;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
